# Kaynak kod değiştiğinde dist/suzgec.html dosyasını yeniden derler, testleri çalıştırır
# ve derlenmiş tek dosyayı depoya geri yazar.
name: Derle

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node build.js
      - name: Derlenmiş dosyayı depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/suzgec.html dist/suzgec.html.sha256
          git diff --cached --quiet || (git commit -m "dist: suzgec.html yeniden derlendi" && git push)
